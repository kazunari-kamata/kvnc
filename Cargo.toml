[package]
name = "kvnc"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Kazunari Kamata"]
repository = "https://github.com/kazunari-kamata/kvnc"
description = "kVNC: a cross-platform command-line VNC server with bidirectional clipboard sync."

[dependencies]
anyhow = "1.0"
aes = "0.8"
argon2 = "0.5"
arboard = { version = "3.7", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
enigo = "0.6.1"
eax = "0.5"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
rpassword = "7.4"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
xcap = "0.9"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[dev-dependencies]
tempfile = "3"
