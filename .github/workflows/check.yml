name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-notices:
    name: license-notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about
        run: cargo install --locked --version 0.9.3 --features cli cargo-about
      - name: Verify third-party license notices
        shell: bash
        run: |
          scripts/generate-third-party-licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES.html

  check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            binary: kvnc
          - label: linux-arm64
            os: ubuntu-24.04-arm
            binary: kvnc
          - label: windows-x64
            os: windows-latest
            binary: kvnc.exe
          - label: macos-x64
            os: macos-15-intel
            binary: kvnc
          - label: macos-arm64
            # macos-15 is GitHub's currently supported standard arm64 macOS
            # runner. The former macos-14 arm64 runner is not available for
            # this repository's runner configuration.
            os: macos-15
            binary: kvnc

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop-capture libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libegl1-mesa-dev libgbm-dev libgl1-mesa-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxrandr-dev

      - name: Check format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Build, test, and lint
        run: |
          cargo build --release --locked
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Verify native binary
        shell: bash
        run: target/release/${{ matrix.binary }} --version

      - name: Package binary
        shell: bash
        run: |
          package_dir="dist/package"
          archive="dist/kvnc-${{ matrix.label }}.tar.gz"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp "target/release/${{ matrix.binary }}" LICENSE THIRD_PARTY_LICENSES.html "$package_dir/"
          tar -czf "$archive" -C "$package_dir" ${{ matrix.binary }} LICENSE THIRD_PARTY_LICENSES.html
          printf '%s\n' ${{ matrix.binary }} LICENSE THIRD_PARTY_LICENSES.html | sort > dist/expected-contents.txt
          tar -tzf "$archive" | sort > dist/archive-contents.txt
          diff --unified=3 dist/expected-contents.txt dist/archive-contents.txt

      - uses: actions/upload-artifact@v6
        with:
          name: kvnc-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
