# SPDX-License-Identifier: MIT
#
# cargo-about policy for the kVNC source tree and release artifacts. The
# generated THIRD_PARTY_LICENSES.html contains the applicable full texts.

accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# Audit the dependency union for each supported release platform. Including
# build, development, and transitive dependencies makes the checked-in notice
# conservative: a notice is never omitted merely because a target differs.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false
